    <script>
        (() => {
            'use strict';
            const API_ENDPOINTS = [
                'https://ipapi.co/json/',
                'https://ip-api.com/json/',
                'https://ipinfo.io/json'
            ];
            const REGION_STORAGE_KEY = 'regionSetting';
            const REGION_ENGINE_MAP = {
                global: 'google',
                china: 'baidu'
            };
            const DEFAULT_ENGINE = 'google';
            const TIMEOUT_MS = 1200;

            const setEngine = (engine) => {
                sessionStorage.setItem('defaultSearchEngine', engine);
            };

            const detectCountry = async (signal) => {
                const requests = API_ENDPOINTS.map(async (api) => {
                    const response = await fetch(api, { signal });
                    if (!response.ok) throw new Error('bad response');
                    const data = await response.json();
                    const countryCode = data.country || data.country_code || data.countryCode;
                    return countryCode === 'CN';
                });
                return Promise.any(requests);
            };

            const initSearchEngine = () => {
                const savedRegion = localStorage.getItem(REGION_STORAGE_KEY);
                if (savedRegion && REGION_ENGINE_MAP[savedRegion]) {
                    setEngine(REGION_ENGINE_MAP[savedRegion]);
                    return;
                }

                if (!sessionStorage.getItem('defaultSearchEngine')) {
                    setEngine(DEFAULT_ENGINE);
                }

                if (!window.fetch || !window.AbortController) {
                    return;
                }

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

                detectCountry(controller.signal)
                    .then((isChinaMainland) => {
                        const existingRegion = localStorage.getItem(REGION_STORAGE_KEY);
                        if (existingRegion && REGION_ENGINE_MAP[existingRegion]) {
                            setEngine(REGION_ENGINE_MAP[existingRegion]);
                            return;
                        }
                        const region = isChinaMainland ? 'china' : 'global';
                        localStorage.setItem(REGION_STORAGE_KEY, region);
                        setEngine(REGION_ENGINE_MAP[region] || DEFAULT_ENGINE);
                        window.dispatchEvent(new CustomEvent('region-autodetected', {
                            detail: { region }
                        }));
                    })
                    .catch(() => {
                        // Keep the default engine on failure or timeout.
                    })
                    .finally(() => {
                        clearTimeout(timeoutId);
                    });
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initSearchEngine);
            } else {
                initSearchEngine();
            }
        })();
    </script>

    <script>
        const CONFIG = {
            ANIMATION_DURATION: 500,
            ERROR_DISPLAY_TIME: 5000,
            PARALLAX_FACTOR: 0.02,
            RETRY_ATTEMPTS: 3,
            RETRY_DELAY: 1000
        };

        const AppState = {
            currentTheme: 'auto',
            currentContent: 'home',
            currentRegion: 'global',
            retryCount: 0,
            links: []
        };

        const Utils = {
            debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            },

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            },

            formatTimestamp(timestamp) {
                const date = new Date(Number(timestamp));
                if (Number.isNaN(date.getTime())) return '';
                const pad = (num) => String(num).padStart(2, '0');
                return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
            },

            getDomain(url) {
                try {
                    return new URL(url).hostname;
                } catch (e) {
                    console.warn(`Invalid URL: ${url}`);
                    return null;
                }
            },

            isMobileDevice() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
                const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                const isSmallScreen = window.innerWidth <= 768;
                
                return mobileRegex.test(userAgent) || (isTouchDevice && isSmallScreen);
            }
        };

        const LoadingManager = {
            show(text = '正在加载...') {
                const overlay = document.getElementById('global-loading');
                const loadingText = overlay?.querySelector('.loading-text');
                if (overlay) {
                    if (loadingText) loadingText.textContent = text;
                    overlay.classList.add('show');
                    overlay.removeAttribute('aria-hidden');
                }
            },

            hide() {
                const overlay = document.getElementById('global-loading');
                if (overlay) {
                    overlay.classList.remove('show');
                    overlay.setAttribute('aria-hidden', 'true');
                }
            },

            showSection(sectionId) {
                const section = document.getElementById(`${sectionId}-loading`);
                if (section) section.style.display = 'block';
            },

            hideSection(sectionId) {
                const section = document.getElementById(`${sectionId}-loading`);
                if (section) section.style.display = 'none';
            }
        };

        const ErrorManager = {
            show(message, type = 'error', duration = CONFIG.ERROR_DISPLAY_TIME) {
                const toast = document.getElementById('error-toast');
                const messageEl = toast?.querySelector('.error-message');
                const iconEl = toast?.querySelector('.error-icon');
                
                if (toast && messageEl && iconEl) {
                    if (this.hideTimer) {
                        clearTimeout(this.hideTimer);
                    }
                    toast.classList.remove('hide');
                    
                    messageEl.textContent = message;
                    iconEl.textContent = type === 'warning' ? '⚠️' : type === 'success' ? '✅' : '❌';
                    toast.className = `error-toast ${type} show`;
                    this.hideTimer = setTimeout(() => this.hide(), duration);
                }
            },

            hide() {
                const toast = document.getElementById('error-toast');
                if (toast) {
                    toast.classList.add('hide');
                    toast.classList.remove('show');
                    setTimeout(() => {
                        toast.style.visibility = 'hidden';
                        toast.classList.remove('hide');
                    }, 300);
                    if (this.hideTimer) {
                        clearTimeout(this.hideTimer);
                        this.hideTimer = null;
                    }
                }
            },

            showSection(sectionId, message, retryCallback) {
                const errorEl = document.getElementById(`${sectionId}-error`);
                const messageEl = errorEl?.querySelector('p');
                const retryBtn = errorEl?.querySelector('.retry-button');
                
                if (errorEl) {
                    if (messageEl) messageEl.textContent = message;
                    if (retryBtn && retryCallback) {
                        retryBtn.onclick = retryCallback;
                    }
                    errorEl.style.display = 'block';
                }
            },

            hideSection(sectionId) {
                const errorEl = document.getElementById(`${sectionId}-error`);
                if (errorEl) errorEl.style.display = 'none';
            }
        };

        window.hideErrorToast = () => ErrorManager.hide();
        window.retryLoadLinks = () => LinkManager.loadWithRetry();

        const SearchManager = {
            currentEngine: sessionStorage.getItem('defaultSearchEngine') || 'google',
            
            updateSearchIcon(engine) {
                const searchIcon = document.querySelector('#main-search-btn .search-icon');
                const searchButton = document.getElementById('main-search-btn');
                if (!searchIcon || !searchButton) return;
                
                searchIcon.innerHTML = '';
                
                switch (engine) {
                    case 'google':
                        const googleImg = document.createElement('img');
                        googleImg.setAttribute('src', 'icon/google.com.png');
                        googleImg.setAttribute('alt', 'Google');
                        googleImg.setAttribute('style', 'width: 16px; height: 16px;');
                        
                        googleImg.addEventListener('error', function() {
                            const textIcon = document.createElement('span');
                            textIcon.textContent = 'G';
                            textIcon.style.cssText = `
                                display: inline-flex;
                                align-items: center;
                                justify-content: center;
                                width: 16px;
                                height: 16px;
                                background: #4285f4;
                                color: white;
                                border-radius: 2px;
                                font-size: 10px;
                                font-weight: bold;
                            `;
                            this.parentNode.replaceChild(textIcon, this);
                        });
                        
                        searchIcon.appendChild(googleImg);
                        searchButton.setAttribute('title', '使用 Google 搜索');
                        break;
                        
                    case 'baidu':
                        const baiduImg = document.createElement('img');
                        baiduImg.setAttribute('src', 'icon/baidu.com.png');
                        baiduImg.setAttribute('alt', '百度');
                        baiduImg.setAttribute('style', 'width: 16px; height: 16px;');
                        baiduImg.addEventListener('error', function() {
                            const textIcon = document.createElement('span');
                            textIcon.textContent = '百';
                            textIcon.style.cssText = `
                                display: inline-flex;
                                align-items: center;
                                justify-content: center;
                                width: 16px;
                                height: 16px;
                                background: #2932e1;
                                color: white;
                                border-radius: 2px;
                                font-size: 10px;
                                font-weight: bold;
                            `;
                            this.parentNode.replaceChild(textIcon, this);
                        });
                        
                        searchIcon.appendChild(baiduImg);
                        searchButton.setAttribute('title', '使用百度搜索');
                        break;
                        
                    default:
                        searchIcon.textContent = '🔍';
                        searchButton.setAttribute('title', '搜索');
                }
            },
            
            search(query, engine = this.currentEngine) {
                if (!query.trim()) {
                    ErrorManager.show('请输入搜索内容', 'warning', 2000);
                    return;
                }
                
                const encodedQuery = encodeURIComponent(query.trim());
                let searchUrl;
                
                switch (engine) {
                    case 'google':
                        searchUrl = `https://www.google.com/search?q=${encodedQuery}`;
                        break;
                    case 'baidu':
                        searchUrl = `https://www.baidu.com/s?wd=${encodedQuery}`;
                        break;
                    case 'scholar':
                        if (this.currentEngine === 'baidu') {
                            searchUrl = `https://xueshu.baidu.com/s?wd=${encodedQuery}`;
                        } else {
                            searchUrl = `https://scholar.google.com/scholar?q=${encodedQuery}`;
                        }
                        break;
                    case 'coding':
                        searchUrl = `https://github.com/search?q=${encodedQuery}&type=repositories`;
                        setTimeout(() => {
                            window.open(`https://stackoverflow.com/search?q=${encodedQuery}`, '_blank');
                        }, 100);
                        break;
                    default:
                        if (this.currentEngine === 'baidu') {
                            searchUrl = `https://www.baidu.com/s?wd=${encodedQuery}`;
                        } else {
                            searchUrl = `https://www.google.com/search?q=${encodedQuery}`;
                        }
                }
                
                window.open(searchUrl, '_blank');
            }
        };

        const LinkManager = {
            BASE_CACHE_KEY: 'linksCache',
            REGION_LINKS_MAP: {
                global: './links.json',
                china: './links_CN.json'
            },
            CACHE_KEY: 'linksCache-global',
            VERSION_URL: './links.version.json',
            LINKS_URL: './links.json',
            VERSION_TIMEOUT_MS: 1200,

            setRegion(region) {
                const normalized = this.REGION_LINKS_MAP[region] ? region : 'global';
                this.LINKS_URL = this.REGION_LINKS_MAP[normalized];
                this.CACHE_KEY = `${this.BASE_CACHE_KEY}-${normalized}`;
            },

            getCache() {
                try {
                    const raw = localStorage.getItem(this.CACHE_KEY);
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    if (!Array.isArray(parsed?.data)) return null;
                    return parsed;
                } catch (err) {
                    return null;
                }
            },

            updateCacheInfo({ version, cachedAt, status } = {}) {
                const versionEl = document.getElementById('cacheVersionDisplay');
                const updatedEl = document.getElementById('cacheUpdatedDisplay');

                if (versionEl) {
                    versionEl.textContent = version || '未缓存';
                }

                if (updatedEl) {
                    if (cachedAt) {
                        updatedEl.textContent = `缓存时间: ${Utils.formatTimestamp(cachedAt)}`;
                    } else if (status) {
                        updatedEl.textContent = status;
                    } else {
                        updatedEl.textContent = '尚未生成缓存';
                    }
                }
            },

            setCache(links, version) {
                try {
                    localStorage.setItem(this.CACHE_KEY, JSON.stringify({
                        data: links,
                        version,
                        cachedAt: Date.now()
                    }));
                } catch (err) {
                    // Ignore quota or serialization errors.
                }
            },

            async fetchVersion(signal) {
                const res = await fetch(this.VERSION_URL, { signal });
                if (!res.ok) throw new Error('版本获取失败');
                const data = await res.json();
                if (!data?.version) throw new Error('版本号缺失');
                return data.version;
            },

            async fetchLinks() {
                const response = await fetch(this.LINKS_URL);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const links = await response.json();
                if (!Array.isArray(links)) {
                    throw new Error('链接数据格式错误');
                }
                return links;
            },

            async checkForUpdates(cached) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), this.VERSION_TIMEOUT_MS);

                try {
                    const version = await this.fetchVersion(controller.signal);
                    const isFresh = cached?.version === version && cached?.data?.length;

                    if (isFresh) {
                        this.updateCacheInfo({
                            version,
                            cachedAt: cached.cachedAt,
                            status: '已是最新缓存'
                        });
                        return;
                    }

                    const links = await this.fetchLinks();
                    AppState.links = links;
                    this.render(links);
                    this.setCache(links, version);
                    this.updateCacheInfo({
                        version,
                        cachedAt: Date.now(),
                        status: '已刷新缓存'
                    });
                    AppState.retryCount = 0;
                } finally {
                    clearTimeout(timeoutId);
                }
            },

            async load() {
                const cached = this.getCache();
                const hasCachedData = Array.isArray(cached?.data) && cached.data.length > 0;

                if (hasCachedData) {
                    AppState.links = cached.data;
                    this.render(cached.data);
                    this.updateCacheInfo({
                        version: cached.version || '未知',
                        cachedAt: cached.cachedAt,
                        status: '已使用本地缓存'
                    });
                    LoadingManager.hideSection('link');
                } else {
                    this.updateCacheInfo({ status: '尚未生成缓存' });
                    LoadingManager.showSection('link');
                }

                ErrorManager.hideSection('link');

                try {
                    await this.checkForUpdates(cached);
                } catch (error) {
                    this.handleError(error);
                } finally {
                    LoadingManager.hideSection('link');
                }
            },

            async loadWithRetry() {
                if (AppState.retryCount >= CONFIG.RETRY_ATTEMPTS) {
                    ErrorManager.show('重试次数过多，请稍后再试', 'error');
                    return;
                }
                
                AppState.retryCount++;
                await Utils.delay(CONFIG.RETRY_DELAY * AppState.retryCount);
                this.load();
            },

            handleError(error) {
                const message = error.message || '加载链接失败，请检查网络连接';
                const cached = this.getCache();
                if (cached) {
                    this.updateCacheInfo({
                        version: cached.version || '未知',
                        cachedAt: cached.cachedAt,
                        status: '加载失败，已回落至缓存'
                    });
                } else {
                    this.updateCacheInfo({ status: '加载失败，暂无缓存' });
                }
                if (!AppState.links || AppState.links.length === 0) {
                    ErrorManager.showSection('link', message, () => this.loadWithRetry());
                    ErrorManager.show(message, 'error');
                } else {
                    ErrorManager.show(`${message}，已使用缓存数据`, 'warning');
                }
            },

            render(links = []) {
                const linkList = document.getElementById('link-list');
                if (!linkList) return;

                linkList.innerHTML = '';
                
                if (links.length === 0) {
                    linkList.innerHTML = '<p style="text-align:center; color: var(--text-secondary);">暂无链接数据</p>';
                    return;
                }

                const fragment = document.createDocumentFragment();
                
                links.forEach(link => {
                    if (!link.url || !link.name) {
                        return;
                    }
                    
                    const linkItem = this.createLinkElement(link);
                    fragment.appendChild(linkItem);
                });

                linkList.appendChild(fragment);
            },

            createLinkElement(link) {
                const linkItem = document.createElement('a');
                linkItem.href = link.url;
                linkItem.target = '_blank';
                linkItem.className = 'link-item';
                const favicon = this.createFaviconElement(link.url);
                linkItem.appendChild(favicon);
                const nameSpan = document.createElement('span');
                nameSpan.textContent = link.name;
                nameSpan.title = link.name; 
                linkItem.appendChild(nameSpan);

                return linkItem;
            },

            createFaviconElement(url) {
                const favicon = document.createElement('img');
                favicon.className = 'favicon';
                favicon.loading = 'lazy';
                const domain = Utils.getDomain(url);
                if (domain) {
                    favicon.src = `icon/${domain}.png`;
                } else {
                    favicon.style.display = 'none';
                }
                return favicon;
            },
        };

        const RegionManager = {
            STORAGE_KEY: 'regionSetting',
            DEFAULT_REGION: 'global',
            REGION_ENGINE_MAP: {
                global: 'google',
                china: 'baidu'
            },

            REGION_ICON_MAP: {
                global: '🌍',
                china: '🇨🇳'
            },

            init() {
                const savedRegion = localStorage.getItem(this.STORAGE_KEY) || this.DEFAULT_REGION;
                this.setRegion(savedRegion, { persist: false, reloadLinks: false });
                window.addEventListener('region-autodetected', (event) => {
                    const detectedRegion = event.detail?.region;
                    if (!detectedRegion || detectedRegion === AppState.currentRegion) {
                        return;
                    }
                    this.setRegion(detectedRegion, { persist: false, reloadLinks: true });
                });
            },

            setRegion(region, { persist = true, reloadLinks = true } = {}) {
                const normalized = this.REGION_ENGINE_MAP[region] ? region : this.DEFAULT_REGION;
                AppState.currentRegion = normalized;

                if (persist) {
                    localStorage.setItem(this.STORAGE_KEY, normalized);
                }

                const engine = this.REGION_ENGINE_MAP[normalized] || 'google';
                sessionStorage.setItem('defaultSearchEngine', engine);
                SearchManager.currentEngine = engine;
                SearchManager.updateSearchIcon(engine);

                LinkManager.setRegion(normalized);
                AppState.retryCount = 0;

                if (reloadLinks) {
                    LinkManager.load();
                }

                this.updateRegionUI(normalized);
                this.updateRegionToggleUI(normalized);
            },

            updateRegionUI(region) {
                const regionOptions = document.querySelectorAll('.region-option');
                regionOptions.forEach(option => {
                    option.classList.toggle('active', option.getAttribute('data-region') === region);
                });
            },

            updateRegionToggleUI(region) {
                const toggleBtn = document.getElementById('region-toggle-btn');
                if (!toggleBtn) return;

                const icon = this.REGION_ICON_MAP[region] || this.REGION_ICON_MAP[this.DEFAULT_REGION];
                const label = region === 'china' ? '中国' : '全球';
                toggleBtn.textContent = icon;
                toggleBtn.title = `当前地区：${label}（点击切换）`;
            },

            toggleRegion() {

                this.setRegion(nextRegion);

        };

        const ThemeManager = {
            init() {
                const savedTheme = localStorage.getItem('theme') || 'auto';
                this.setTheme(savedTheme);
                this.updateThemeUI(savedTheme);
            },

            setTheme(theme) {
                AppState.currentTheme = theme;
                localStorage.setItem('theme', theme);
                
                if (theme === 'dark') {
                    document.body.classList.add('dark-mode');
                } else if (theme === 'light') {
                    document.body.classList.remove('dark-mode');
                } else {
                    const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    document.body.classList.toggle('dark-mode', isDarkMode);
                }
            },

            updateThemeUI(theme) {
                const themeOptions = document.querySelectorAll('.theme-option[data-theme]');
                themeOptions.forEach(option => {
                    option.classList.toggle('active', option.getAttribute('data-theme') === theme);
                });
            },

            toggle() {

                const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
                this.setTheme(nextTheme);
                this.updateThemeUI(nextTheme);
            }
        };

        const ContentManager = {
            menuOrder: { 'home': 0, 'search': 1, 'coding': 2, 'settings': 3 },
            
            init() {
                this.initializeContentCards();
                this.updateActiveStates(AppState.currentContent);
            },
            
            initializeContentCards() {
                const contentCards = document.querySelectorAll('.content-card');
                
                contentCards.forEach(card => {
                    const cardId = card.id;
                    const contentType = cardId.replace('content-', '');
                    card.classList.remove('active', 'prev', 'next', 'from-right', 'from-left', 'exit-left', 'exit-right');
                    
                    if (contentType === AppState.currentContent) {
                        card.classList.add('active');
                    }
                });
            },
            
            switch(targetContent) {
                if (AppState.currentContent === targetContent) return;
                
                const currentIndex = this.menuOrder[AppState.currentContent];
                const targetIndex = this.menuOrder[targetContent];
                const isMovingRight = targetIndex > currentIndex;
                
                this.animateTransition(AppState.currentContent, targetContent, isMovingRight);
                this.updateActiveStates(targetContent);
                
                AppState.currentContent = targetContent;
            },

            animateTransition(currentContent, targetContent, isMovingRight) {
                const currentCard = document.getElementById(`content-${currentContent}`);
                const targetCard = document.getElementById(`content-${targetContent}`);
                if (!currentCard || !targetCard) return;
                currentCard.classList.add(isMovingRight ? 'exit-left' : 'exit-right');
                setTimeout(() => {
                    document.querySelectorAll('.content-card').forEach(card => {
                        card.classList.remove('active', 'prev', 'next', 'from-right', 'from-left', 'exit-left', 'exit-right');
                    });
                    targetCard.classList.add('active');
                    targetCard.classList.add(isMovingRight ? 'from-right' : 'from-left');
                    setTimeout(() => {
                        targetCard.classList.remove('from-right', 'from-left');
                    }, CONFIG.ANIMATION_DURATION);
                }, 50);
            },

            updateActiveStates(targetContent) {
                document.querySelectorAll('.dock-item').forEach(item => {
                    const isActive = item.getAttribute('data-content') === targetContent;
                    item.classList.toggle('active', isActive);
                });
                const targetMenuItem = document.querySelector(`.dock-item[data-content="${targetContent}"]`);
                if (targetMenuItem) {
                    DockManager.moveBubbleTo(targetMenuItem);
                }
            }
        };

        const EventManager = {
            init() {
                this.setupDockEvents();
                this.setupSearchEvents();
                this.setupThemeEvents();
                this.setupRegionEvents();
                this.setupRegionToggleEvents();
                this.setupKeyboardEvents();
                this.setupGlobalEvents();
                this.setupClearCacheEvents();
            },

            setupDockEvents() {

                    if ('ontouchstart' in window) {
                        item.addEventListener('touchstart', this.handleDockItemTouch.bind(this));
                        item.addEventListener('touchend', this.handleDockItemTouchEnd.bind(this));
                    }
                });

                const dock = document.querySelector('.dock');
                if (dock) {
                    dock.addEventListener('mouseenter', this.handleDockHover.bind(this));
                    dock.addEventListener('mouseleave', this.handleDockLeave.bind(this));
                }
            },

            setupSearchEvents() {
                const searches = [
                    {
                        inputId: 'main-search-input',
                        buttonId: 'main-search-btn',
                        engine: null,
                        errorMessage: '搜索失败，请重试',
                        iconDisplay: 'inline-flex'
                    },
                    {
                        inputId: 'scholar-search-input',
                        buttonId: 'scholar-search-btn',
                        engine: 'scholar',
                        errorMessage: '学术搜索失败，请重试',
                        iconDisplay: 'inline'
                    },
                    {
                        inputId: 'coding-search-input',
                        buttonId: 'coding-search-btn',
                        engine: 'coding',
                        errorMessage: '编码搜索失败，请重试',
                        iconDisplay: 'inline'
                    }
                ];

                searches.forEach((config) => {
                    const input = document.getElementById(config.inputId);
                    const button = document.getElementById(config.buttonId);
                    const runSearch = () => this.handleSearch(config);

                    button?.addEventListener('click', runSearch);
                    input?.addEventListener('keypress', (event) => {
                        if (event.key === 'Enter') {
                            runSearch();
                        }
                    });
                });

                const suggestionTags = document.querySelectorAll('.tag');
                suggestionTags.forEach(tag => {
                    tag.addEventListener('click', this.handleTagClick.bind(this));
                });
            },

            setupThemeEvents() {
                const themeToggle = document.querySelector('.theme-toggle');
                const themeOptions = document.querySelectorAll('.theme-option[data-theme]');
                
                if (themeToggle) {
                    themeToggle.addEventListener('click', (e) => {
                        e.preventDefault();
                        ThemeManager.toggle();
                    });
                }

                themeOptions.forEach(option => {
                    option.addEventListener('click', this.handleThemeOptionClick.bind(this));
                });
            },

            setupRegionEvents() {
                const regionOptions = document.querySelectorAll('.region-option');
                regionOptions.forEach(option => {
                    option.addEventListener('click', this.handleRegionOptionClick.bind(this));
                });
            },

            setupRegionToggleEvents() {
                const regionToggleBtn = document.getElementById('region-toggle-btn');
                if (regionToggleBtn) {
                    regionToggleBtn.addEventListener('click', this.handleRegionToggleClick.bind(this));
                }
            },

            setupKeyboardEvents() {
                document.addEventListener('keydown', this.handleKeyDown.bind(this));
            },

            setupGlobalEvents() {
                window.addEventListener('resize', Utils.debounce(this.handleResize.bind(this), 250), { passive: true });

                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handler = this.handleSystemThemeChange.bind(this);
                if (typeof mediaQuery.addEventListener === 'function') {
                    mediaQuery.addEventListener('change', handler);
                } else if (typeof mediaQuery.addListener === 'function') {
                    mediaQuery.addListener(handler);
                }
            },

            setupClearCacheEvents() {
                const clearCacheBtn = document.getElementById('clearCacheBtn');
                if (clearCacheBtn) {
                    clearCacheBtn.addEventListener('click', this.handleClearCacheClick.bind(this));
                }
            },

            handleDockItemClick(e) {
                e.preventDefault();
                const targetContent = e.currentTarget.getAttribute('data-content');
                ContentManager.switch(targetContent);
            },

            handleDockItemHover(e) {
                DockManager.moveBubbleTo(e.currentTarget);
                DockManager.addMagneticEffect(e.currentTarget);
            },

            handleDockItemLeave(e) {
                DockManager.resetMagneticEffect();
            },

            handleDockItemTouch(e) {
                e.preventDefault();
                DockManager.moveBubbleTo(e.currentTarget);
                e.currentTarget.style.transform = 'scale(0.95)';
            },

            handleDockItemTouchEnd(e) {
                e.preventDefault();
                e.currentTarget.style.transform = '';
                const targetContent = e.currentTarget.getAttribute('data-content');
                ContentManager.switch(targetContent);
            },

            handleDockHover(e) {
                e.currentTarget.style.transform = 'translateX(-50%) translateY(-2px) scale(1.02)';
            },

            handleDockLeave(e) {
                e.currentTarget.style.transform = 'translateX(-50%) translateY(0) scale(1)';
                
                setTimeout(() => {
                    const activeItem = document.querySelector('.dock-item.active');
                    if (activeItem) {
                        DockManager.moveBubbleTo(activeItem);
                    }
                    DockManager.resetMagneticEffect();
                }, 150);
            },

            async handleSearch({ inputId, buttonId, engine, errorMessage, iconDisplay }) {
                const searchInput = document.getElementById(inputId);
                const query = searchInput?.value.trim();

                if (!query) {
                    ErrorManager.show('请输入搜索内容', 'warning', 2000);
                    return;
                }

                try {
                    this.setSearchButtonLoading(buttonId, true, iconDisplay);
                    await Utils.delay(300);
                    SearchManager.search(query, engine);
                } catch (error) {
                    ErrorManager.show(errorMessage, 'error');
                } finally {
                    this.setSearchButtonLoading(buttonId, false, iconDisplay);
                }
            },

            handleTagClick(e) {
                const query = e.target.textContent;
                let searchEngine;
                if (AppState.currentContent === 'search') {
                    searchEngine = 'scholar';
                } else if (AppState.currentContent === 'coding') {
                    searchEngine = 'coding';
                } else {
                    searchEngine = SearchManager.currentEngine;
                }
                SearchManager.search(query, searchEngine);
            },

            handleThemeOptionClick(e) {
                const theme = e.currentTarget.getAttribute('data-theme');
                ThemeManager.setTheme(theme);
                ThemeManager.updateThemeUI(theme);
            },

            handleRegionOptionClick(e) {
                const region = e.currentTarget.getAttribute('data-region');
                RegionManager.setRegion(region);
            },

            handleRegionToggleClick(e) {
                e.preventDefault();
                RegionManager.toggleRegion();
            },

            handleKeyDown(e) {
                if (e.ctrlKey || e.metaKey) {
                    switch(e.key) {
                        case '1':
                            e.preventDefault();
                            ContentManager.switch('home');
                            break;
                        case '2':
                            e.preventDefault();
                            ContentManager.switch('search');
                            break;
                        case '3':
                            e.preventDefault();
                            ContentManager.switch('coding');
                            break;
                        case 'd':
                            e.preventDefault();
                            ThemeManager.toggle();
                            break;
                    }
                }
                
                if (e.key === 'Escape') {
                    ErrorManager.hide();
                }
            },

            handleResize() {
                const activeItem = document.querySelector('.dock-item.active');
                if (activeItem) {
                    DockManager.moveBubbleTo(activeItem);
                }
            },

            handleSystemThemeChange(e) {
                if (AppState.currentTheme === 'auto') {
                    document.body.classList.toggle('dark-mode', e.matches);
                }
            },

            setSearchButtonLoading(buttonId, isLoading, iconDisplay = 'inline') {
                const searchIcon = document.querySelector(`#${buttonId} .search-icon`);
                const searchLoading = document.querySelector(`#${buttonId} .search-loading`);
                const searchButton = document.getElementById(buttonId);

                if (!searchIcon || !searchLoading || !searchButton) {
                    return;
                }

                searchIcon.style.display = isLoading ? 'none' : iconDisplay;
                searchLoading.style.display = isLoading ? 'inline' : 'none';
                searchButton.disabled = isLoading;
            },

            handleClearCacheClick(e) {
                const btn = e.currentTarget;
                if (btn.classList.contains('confirm')) {
                    this.performClearCache();
                } else {
                    btn.classList.add('confirm');
                    btn.textContent = '❗确定吗❗';
                    setTimeout(() => {
                        if (btn.classList.contains('confirm')) {
                            btn.classList.remove('confirm');
                            btn.textContent = '🗑️ 清空缓存';
                        }
                    }, 3000);
                }
            },

            async performClearCache() {
                this.playShredderAnimation();
                await Utils.delay(2000);
                try {
                    localStorage.clear();
                    sessionStorage.clear();
                    if ('caches' in window) {
                        const cacheNames = await caches.keys();
                        await Promise.all(
                            cacheNames.map(cacheName => caches.delete(cacheName))
                        );
                    }
                    
                    window.location.reload();
                } catch (error) {
                    ErrorManager.show('清空缓存失败，请手动刷新页面', 'error');
                }
            },

            playShredderAnimation() {
                const overlay = document.createElement('div');
                overlay.className = 'shredder-overlay';
                const shredderTop = document.createElement('div');
                shredderTop.className = 'shredder-top';
                overlay.appendChild(shredderTop);
                const stripCount = Math.floor(window.innerWidth / 20) + 1;
                for (let i = 0; i < stripCount; i++) {
                    const strip = document.createElement('div');
                    strip.className = 'paper-strip';
                    strip.style.left = `${i * 20}px`;
                    strip.style.animationDelay = `${Math.random() * 0.3}s`;
                    overlay.appendChild(strip);
                }
                
                document.body.appendChild(overlay);
                setTimeout(() => {
                    overlay.remove();
                }, 2500);
            }
        };
        // Dock管理 - Dock Management
        const DockManager = {
            init() {
                const activeItem = document.querySelector('.dock-item.active');
                if (activeItem) {
                    setTimeout(() => this.moveBubbleTo(activeItem), 100);
                }
            },

            moveBubbleTo(item) {
                if (!item) return;
                
                const bubble = document.querySelector('.dock-bubble');
                const dock = document.querySelector('.dock');
                if (!bubble || !dock) return;
                
                const itemRect = item.getBoundingClientRect();
                const dockRect = dock.getBoundingClientRect();
                const left = itemRect.left - dockRect.left;
                const width = itemRect.width;

                bubble.style.left = `${left}px`;
                bubble.style.width = `${width}px`;
                bubble.style.opacity = '1';
                bubble.style.transform = 'scale(1)';
                
                const isDarkMode = document.body.classList.contains('dark-mode');
                const glowColor = isDarkMode ? 'rgba(10, 132, 255, 0.2)' : 'rgba(0, 113, 227, 0.15)';
                
                if (item.classList.contains('active')) {
                    bubble.style.boxShadow = `
                        0 4px 16px rgba(0, 0, 0, 0.1),
                        inset 0 1px 1px rgba(255, 255, 255, 0.3),
                        0 0 20px ${glowColor}
                    `;
                } else {
                    bubble.style.boxShadow = `
                        0 4px 16px rgba(0, 0, 0, 0.1),
                        inset 0 1px 1px rgba(255, 255, 255, 0.3)
                    `;
                }
            },

            addMagneticEffect(hoveredItem) {
                const dockItems = document.querySelectorAll('.dock-item');
                const hoveredIndex = Array.from(dockItems).indexOf(hoveredItem);
                
                dockItems.forEach((item, index) => {
                    const distance = Math.abs(index - hoveredIndex);
                    if (distance === 1) {
                        const direction = index < hoveredIndex ? 2 : -2;
                        item.style.transform = `translateX(${direction}px) scale(1.02)`;
                    } else if (distance > 1) {
                        item.style.transform = '';
                    }
                });
            },

            resetMagneticEffect() {
                document.querySelectorAll('.dock-item').forEach(item => {
                    item.style.transform = '';
                });
            }
        };

        const DockAutoHideManager = {
            initialized: false,
            isDockHidden: false,
            lastScrollY: 0,
            isMouseOverIndicator: false,
            showTimeout: null, 

            init() {
                try {
                    if (this.initialized) {
                        return;
                    }
                    const isMobile = Utils.isMobileDevice();
                    if (isMobile) {
                        return;
                    }
                    this.initialized = true;
                    this.setupHoverEvents();
                    this.lastScrollY = window.scrollY;
                } catch (error) {
                }
            },

            setupHoverEvents() {
                const dock = document.querySelector('.dock');
                let indicator = document.querySelector('.bottom-indicator');
                if (!indicator) {
                    indicator = document.createElement('div');
                    indicator.className = 'bottom-indicator';
                    document.body.appendChild(indicator);
                }
                if (indicator) {
                    indicator.addEventListener('mouseenter', () => {
                        this.isMouseOverIndicator = true;
                        this.clearShowTimeout();
                        if (this.isDockHidden) {
                            this.showDock();
                        }
                    });

                    indicator.addEventListener('mouseleave', () => {
                        this.isMouseOverIndicator = false;
                        if (this.isDockHidden === false) {
                            this.scheduleShowTimeout();
                        }
                    });

                    indicator.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (this.isDockHidden) {
                            this.showDock();
                            this.scheduleShowTimeout();
                        }
                    });
                }

                if (dock) {
                    dock.addEventListener('mouseenter', () => {
                        if (this.isDockHidden) {
                            this.showDock();
                        }
                        this.clearShowTimeout();
                    });

                    dock.addEventListener('mouseleave', () => {
                        if (!this.isMouseOverIndicator) {
                            this.scheduleShowTimeout();
                        }
                    });
                }
            },

            hideDock() {
                const dock = document.querySelector('.dock');
                const indicator = document.querySelector('.bottom-indicator');
                
                if (dock && !this.isDockHidden) {
                    dock.classList.add('hidden');
                    dock.classList.remove('showing');
                    this.isDockHidden = true;
                }
                
                if (indicator) {
                    indicator.classList.add('visible');
                }
            },

            showDock() {
                const dock = document.querySelector('.dock');
                const indicator = document.querySelector('.bottom-indicator');
                
                if (dock) {
                    dock.classList.remove('hidden');
                    dock.classList.add('showing');
                    this.isDockHidden = false;
                    
                    setTimeout(() => {
                        if (!this.isDockHidden) {
                            const parallax = this.lastScrollY * CONFIG.PARALLAX_FACTOR;
                            dock.style.transform = `translateX(-50%) translateY(${parallax}px)`;
                        }
                    }, 100);
                }
                
                if (indicator) {
                    indicator.classList.remove('visible');
                }
            },

            scheduleShowTimeout() {
                this.clearShowTimeout();
                this.showTimeout = setTimeout(() => {
                    if (!this.isMouseOverIndicator) {
                        this.hideDock();
                    }
                    this.showTimeout = null;
                }, 3000);
            },

            clearShowTimeout() {
                if (this.showTimeout) {
                    clearTimeout(this.showTimeout);
                    this.showTimeout = null;
                }
            }
        };

        const App = {
            async init() {
                try {
                    LoadingManager.show('正在初始化应用...');
                    ThemeManager.init();
                    DockManager.init();
                    DockAutoHideManager.init();
                    ContentManager.init();
                    RegionManager.init();
                    EventManager.init();
                    
                    await LinkManager.load();
                    LoadingManager.hide();
                    this.showFirstTimeHints();
                } catch (error) {
                    LoadingManager.hide();
                    ErrorManager.show('应用初始化失败，请刷新页面重试', 'error');
                }
            },

            showFirstTimeHints() {
                const hasVisited = localStorage.getItem('hasVisited');
                if (!hasVisited) {
                    setTimeout(() => {
                        ErrorManager.show('💡 提示：使用 Ctrl/Cmd + 1/2/3 快速切换页面，Ctrl/Cmd + D 切换主题。搜索按钮图标显示当前使用的搜索引擎！', 'success', 10000);
                        localStorage.setItem('hasVisited', 'true');
                    }, 3000);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
