<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03050a">
  <meta name="description" content="一座漂浮在星际航道中的时钟。">
  <title>星际时刻 · Yuhao</title>
  <link rel="icon" type="image/png" href="touxiang.png">
  <link rel="stylesheet" href="styles/index.css?v=20260730-1">
</head>
<body>
  <div class="warp-background" aria-hidden="true">
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>
  </div>
  <div class="space-haze" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="link.html" aria-label="前往链接库">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>XSTIME</span>
    </a>

    <div class="live-indicator" aria-label="新闻实时更新中">
      <span class="live-dot" aria-hidden="true"></span>
      <span>LIVE</span>
    </div>
  </header>

  <aside class="news-stage" aria-live="polite" aria-atomic="true">
    <a id="news-card" class="news-card" href="#" target="_blank" rel="noopener noreferrer" aria-label="查看热点新闻">
      <span class="news-kicker">
        <span class="news-pulse" aria-hidden="true"></span>
        WORLD SIGNAL
      </span>
      <span id="news-title" class="news-title">正在接收全球热点信号…</span>
      <span id="news-meta" class="news-meta">WIKIMEDIA · LIVE</span>
      <span class="news-arrow" aria-hidden="true">↗</span>
    </a>
  </aside>

  <main class="clock-stage">
    <section class="clock-panel" aria-label="当前时间">
      <p id="time-zone" class="time-zone">正在定位地点…</p>
      <time id="clock" class="clock" datetime="00:00:00">
        <span id="hours">00</span>
        <span class="colon" aria-hidden="true"><i></i><i></i></span>
        <span id="minutes">00</span>
      </time>
      <div class="clock-footer">
        <p id="seconds" class="seconds">00</p>
        <span class="divider" aria-hidden="true"></span>
        <p id="date" class="date">2026年7月29日 星期三</p>
      </div>
    </section>
  </main>

  <footer class="hud-footer">
    <p><span class="status-dot" aria-hidden="true"></span>WARP DRIVE ACTIVE</p>
    <button id="motion-toggle" class="motion-toggle" type="button" aria-pressed="false">
      <span class="pause-icon" aria-hidden="true"></span>
      <span class="motion-label">暂停航行</span>
    </button>
  </footer>

  <noscript>请启用 JavaScript 以显示动态星空和实时时钟。</noscript>
  <script src="scripts/index.js?v=20260730-3" defer></script>
</body>
</html>
